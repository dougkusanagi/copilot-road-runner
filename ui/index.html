<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>copilot-road-runner</title>
<style>
  :root {
    --bg: rgba(24, 24, 28, .96);
    --bg2: rgba(255, 255, 255, .06);
    --fg: #e8e8ec;
    --muted: #8d8d99;
    --accent: #0078d4;
    --accent2: #66b2ff;
    --rec: #e5484d;
    --ok: #3dd68c;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; font: 15px/1.4 "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; color: var(--fg); user-select: none; }
  body { padding: 10px; }
  .card {
    background: var(--bg); border: 1px solid rgba(255,255,255,.08); border-radius: var(--radius);
    box-shadow: 0 18px 50px rgba(0,0,0,.55), 0 0 0 1px rgba(0,0,0,.4);
    backdrop-filter: blur(24px); overflow: hidden;
    transition: box-shadow .25s ease;
  }
  .card.recording { box-shadow: 0 18px 50px rgba(0,0,0,.55), 0 0 0 2px var(--rec), 0 0 28px rgba(229,72,77,.35); }
  .card.running   { box-shadow: 0 18px 50px rgba(0,0,0,.55), 0 0 0 2px var(--accent), 0 0 28px rgba(0,120,212,.35); }

  .row { display: flex; align-items: center; gap: 8px; padding: 12px 14px; }
  .logo { width: 30px; height: 30px; border-radius: 9px; flex: none;
    background: linear-gradient(135deg, var(--accent), var(--accent2)); position: relative; }
  .logo::after { content: ""; position: absolute; inset: 9px; border-radius: 4px; background: rgba(255,255,255,.9); }
  .card.running .logo { animation: spin 1.6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #q { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: var(--fg);
    font: 20px/1.3 inherit; padding: 6px 4px; user-select: text; }
  #q::placeholder { color: var(--muted); }
  #q.partial { color: var(--accent2); font-style: italic; }

  button { border: 0; border-radius: 10px; height: 36px; padding: 0 12px; cursor: pointer;
    color: var(--fg); background: var(--bg2); font: 600 13px inherit; display: inline-flex; align-items: center; gap: 6px;
    transition: background .15s, transform .08s, opacity .15s; white-space: nowrap; }
  button:hover { background: rgba(255,255,255,.12); }
  button:active { transform: scale(.96); }
  button:disabled { opacity: .35; cursor: default; }
  button.primary { background: var(--accent); }
  button.primary:hover { background: #1a86e0; }
  button.danger { background: var(--rec); }
  button.icon { width: 36px; padding: 0; justify-content: center; }
  .hidden { display: none !important; }

  .mic { position: relative; }
  .mic.on { background: var(--rec); }
  .mic.on::before { content: ""; position: absolute; inset: -4px; border-radius: 14px;
    border: 2px solid var(--rec); animation: pulse 1.2s ease-out infinite; }
  @keyframes pulse { from { opacity: .9; transform: scale(.9); } to { opacity: 0; transform: scale(1.25); } }
  svg { width: 18px; height: 18px; fill: currentColor; }

  .status { display: flex; align-items: center; gap: 10px; padding: 0 16px 10px; color: var(--muted); font-size: 12.5px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.ok { background: var(--ok); } .dot.rec { background: var(--rec); } .dot.run { background: var(--accent2); }
  .status .hint { margin-left: auto; opacity: .7; }
  kbd { background: rgba(255,255,255,.08); border-radius: 5px; padding: 1px 6px; font: 11px inherit; }

  #log { max-height: 0; overflow: auto; border-top: 1px solid rgba(255,255,255,.06);
    transition: max-height .3s ease; font: 12.5px/1.5 Consolas, "Cascadia Mono", monospace; color: #c7c7d1; }
  #log.open { max-height: 220px; }
  #log div { padding: 3px 16px; white-space: pre-wrap; }
  #log div:nth-child(odd) { background: rgba(255,255,255,.025); }
  #log .k { color: var(--accent2); }
  #log .err { color: var(--rec); }
  #log .ok { color: var(--ok); }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="row">
    <div class="logo" title="copilot-road-runner"></div>
    <input id="q" placeholder="O que eu faço? ex: abra o Notepad e escreva Olá" autocomplete="off" spellcheck="false">
    <button id="mic" class="icon mic" title="Ditar (falar)">
      <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2z"/></svg>
    </button>
    <button id="stop" class="hidden" title="Parar: o texto fica na caixa para corrigir">
      <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg> Parar
    </button>
    <button id="send" class="primary" title="Enviar (Enter)">
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg> Enviar
    </button>
    <button id="abort" class="danger hidden" title="Abortar o agente (Ctrl+Alt+Esc)">
      <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg> Abortar
    </button>
  </div>
  <div class="status">
    <span class="dot" id="dot"></span>
    <span id="status">pronto</span>
    <span class="hint"><kbd>Enter</kbd> enviar · <kbd>Esc</kbd> esconder · <kbd id="hk">ctrl+alt+space</kbd> mostrar</span>
  </div>
  <div id="log"></div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const card = $("card"), q = $("q"), mic = $("mic"), stop = $("stop"), send = $("send"),
        abort = $("abort"), status = $("status"), dot = $("dot"), log = $("log");
  let mode = "idle"; // idle | recording | running

  function api() { return window.pywebview && window.pywebview.api; }
  function setMode(m) {
    mode = m;
    card.classList.toggle("recording", m === "recording");
    card.classList.toggle("running", m === "running");
    mic.classList.toggle("on", m === "recording");
    mic.classList.toggle("hidden", m === "recording");
    stop.classList.toggle("hidden", m !== "recording");
    send.classList.toggle("hidden", m === "running");
    abort.classList.toggle("hidden", m !== "running");
    q.disabled = m === "running";
    mic.disabled = m === "running";
    dot.className = "dot " + ({recording: "rec", running: "run", idle: "ok"}[m] || "");
  }
  function setStatus(t) { status.textContent = t; }
  function addLog(line, cls) {
    const d = document.createElement("div");
    if (cls) d.className = cls;
    d.textContent = line;
    log.appendChild(d); log.classList.add("open"); log.scrollTop = log.scrollHeight;
    while (log.children.length > 200) log.removeChild(log.firstChild);
  }

  // --- chamadas Python -> JS (window.evaluate_js) ---------------------------
  window.crr = {
    partial(text) { q.value = text; q.classList.add("partial"); setStatus("ouvindo… (fale; silêncio envia)"); },
    final(text, sent) {
      q.value = text; q.classList.remove("partial");
      setMode("idle");
      setStatus(sent ? "enviando…" : (text ? "corrija e pressione Enter" : "nada ouvido"));
      if (!sent) { q.focus(); q.setSelectionRange(text.length, text.length); }
    },
    running(task) { setMode("running"); setStatus("executando: " + task); log.innerHTML = ""; },
    step(line, cls) { addLog(line, cls || ""); },
    done(result, summary) {
      setMode("idle"); setStatus("resultado: " + result);
      addLog(summary, result === "done" ? "ok" : "err");
      q.value = ""; q.focus();
    },
    error(msg) { setMode("idle"); setStatus("erro: " + msg); addLog(msg, "err"); },
    hotkey(h) { $("hk").textContent = h; },
    focus() { q.focus(); q.select(); },
  };

  // --- ações do usuário --------------------------------------------------------
  async function submit() {
    if (mode === "running") return;
    // gravando: sempre para+envia (Python rebaixa p/ não-enviar se vier vazio)
    if (mode === "recording") { await api().dictation_stop(true); return; }
    const text = q.value.trim();
    if (!text) return;
    q.classList.remove("partial");
    await api().submit(text);
  }
  send.onclick = submit;
  mic.onclick = async () => { if (mode !== "idle") return; q.value = ""; setMode("recording"); setStatus("carregando modelo / ouvindo…"); await api().dictation_start(); };
  stop.onclick = async () => { await api().dictation_stop(false); };
  abort.onclick = async () => { await api().abort(); };
  q.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); submit(); }
    else if (e.key === "Escape") { e.preventDefault(); if (mode === "recording") stop.onclick(); else api().hide(); }
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && mode !== "recording") api() && api().hide(); });
  window.addEventListener("pywebviewready", () => { api().ready(); q.focus(); });
  setMode("idle");
</script>
</body>
</html>
